# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# PHPMD is a spin-off project of PHP Depend and
# aims to be a PHP equivalent of the well known Java tool PMD.
# What PHPMD does is: It takes a given PHP source code base
# and look for several potential problems within that source.
# These problems can be things like:
#   Possible bugs
#   Suboptimal code
#   Overcomplicated expressions
#   Unused parameters, methods, properties
# More details at https://phpmd.org/

name: PHPMD

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above ##
    branches: [ "main" ]
  schedule:
    - cron: '24 13 * * 0'

permissions:
  contents: read

jobs:
  PHPMD:
    name: Run PHPMD scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@aa1fe473f9c687b6fb896056d771232c0bc41161
        with:
          coverage: none
          tools: phpmd
          
      - name: Run PHPMD
        continue-on-error: true
        run: |
          # 1. Ensure the target directory exists for the report file
          mkdir -p .github/workflows
          
          # 2. Scan the current root directory (.) and exclude the .github folder
          phpmd analyze . \
            --format sarif \
            --ruleset codesize \
            --exclude .github \
            --reportfile-sarif .github/workflows/phpmd-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .github/workflows/phpmd-results.sarif
          wait-for-processing: true
          checkout_path: /home/runner/work/wp-cs-theme/wp-cs-theme
